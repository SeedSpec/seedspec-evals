candidates:
  - id: known-bad
    classification: known-bad
    description: A superficially complete feature that destructively migrates host data, auto-posts transactions, and drifts monthly schedules.
    artifact:
      path: candidates/known-bad
      digest: sha256:aae5c1f526f18fd4837f9d875253cab0429a21808dae228dcd4ab80458adcad4
    expected:
      acceptability: reject
      rationale: It violates fixed host-data, posting-authority, and stable-calendar obligations.
      dimensions:
        - dimension: correctness
          expectation: must-detect-concern
          rationale: Automatic posting and execution-time schedule drift contradict required behavior.
        - dimension: maintainability
          expectation: must-detect-concern
          rationale: Replacing the host transaction model violates the additive integration boundary.
  - id: valid-alternative
    classification: valid-alternative
    description: A valid on-read due calculation using structured cadence fields rather than a scheduler or schedule string.
    artifact:
      path: candidates/valid-alternative
      digest: sha256:be9419878d9492d6b129bd7775fe39f39f9a97209a5fbc3b788b7b146540ef95
    expected:
      acceptability: accept
      rationale: It preserves every fixed outcome while exercising explicitly permitted implementation latitude.
      dimensions:
        - dimension: flexibility
          expectation: must-not-penalize
          rationale: The evaluator must not require a scheduler or one recurrence representation.
